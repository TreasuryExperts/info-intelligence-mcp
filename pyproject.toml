[project]
name = "info-intelligence-mcp"
version = "0.1.0"
description = "Portable info intelligence kit: CLI-first, optional MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "feedparser>=6.0",
  "httpx>=0.27",
  "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
info-intel = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
